[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tribal-stab"
version = "1.0.0"
description = "Stabilisation des vidéos tenues à la main : repères sur le décor, vote RANSAC, trépied virtuel, zoom minimal sans bord noir, rendu sous-pixel."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tribal Enterprises SARL" }]
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.scripts]
tribal-stab = "tribal_stab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
